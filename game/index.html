<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crescent Bay</title>
<meta name="description" content="Crescent Bay — open-world top-down crime game: kerja untuk Selin, kabur dari polisi, kuasai jalanan.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Crescent Bay: open-world top-down game — drive, run missions for Selin, and escape the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
